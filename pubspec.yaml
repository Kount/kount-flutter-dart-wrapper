name: kount_sdk_wrapper
description: Wrapper library for Kount SDK Flutter with utilities for session management, configuration, and data collection.
version: 1.0.0

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  test: ^1.24.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kount.sdk.flutter
        pluginClass: KountPlugin
      ios:
        pluginClass: KountPlugin
